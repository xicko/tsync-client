services:
  redis:
    container_name: tsync-redis
    image: redis:7.4-alpine
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 3s
    restart: unless-stopped

  server:
    container_name: tsync-server
    image: tsync-server:latest
    build:
      context: ./server
      dockerfile: Dockerfile
    network_mode: host
    environment:
      HOST_IP: ${HOST_IP}
      SERVER_PORT: ${SERVER_PORT}
      TAILNET_ID: ${TAILNET_ID}
      TAILNET_API_KEY: ${TAILNET_API_KEY}
      TAILSCALE_BASE_URL: ${TAILSCALE_BASE_URL}
      ONESIGNAL_APP_ID: ${ONESIGNAL_APP_ID}
      ONESIGNAL_REST_KEY: ${ONESIGNAL_REST_KEY}
      ONESIGNAL_ANDROID_IMPORTANT_CHANNEL_ID: ${ONESIGNAL_ANDROID_IMPORTANT_CHANNEL_ID}
      NTFY_URL: ${NTFY_URL}
      NTFY_TOPIC: ${NTFY_TOPIC}
      MONGO_URI: ${MONGO_URI}
      DB_NAME: ${DB_NAME}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY}
      SUPABASE_STORAGE_BUCKET_NAME: ${SUPABASE_STORAGE_BUCKET_NAME}
    volumes:
      - adb-keys:/root/.android
      - /var/tsync/storage:/var/tsync/storage
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://${HOST_IP}:${SERVER_PORT}/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    restart: unless-stopped
    depends_on: 
      redis:
        condition: service_healthy

  web:
    container_name: tsync-web
    image: tsync-web:latest
    build:
      context: ./client
      dockerfile: apps/rn/Dockerfile
      args:
        EXPO_PUBLIC_BASE_API_URL: ${EXPO_PUBLIC_BASE_API_URL}
        EXPO_PUBLIC_ONESIGNAL_APPID: ${EXPO_PUBLIC_ONESIGNAL_APPID}
    ports:
      - "${HOST_IP:?HOST_IP is not set}:${WEB_PORT:?WEB_PORT is not set}:80"
    restart: unless-stopped
    # depends_on:
    #   server:
    #     condition: service_healthy

volumes:
  redis_data:
  adb-keys:
