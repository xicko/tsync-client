services:
  web:
    container_name: tsync-web
    image: tsync-web:latest
    build:
      context: .
      dockerfile: apps/rn/Dockerfile
    ports:
      - "${WEBHOST_IP:?WEBHOST_IP is not set}:${WEBHOST_PORT:?WEBHOST_PORT is not set}:80"
    env_file:
      - ./apps/rn/.env
    restart: unless-stopped
